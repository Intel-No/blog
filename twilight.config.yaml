        # Meting API 地址
        meting_api: "https://meting.spr-aachen.com/api"
        # 音乐平台
        server: "netease"
        # 类型 ("playlist" 歌单 | "song" 单曲)
        type: "playlist"
        # 资源 ID
        id: "18324861370"
    # local 模式专属配置
    local:
